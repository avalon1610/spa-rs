[package]
edition = "2024"
name = "spa-rs"
version = "0.10.1"
description = "Embed all SPA web application files and release as a single binary executable."
license = "MIT"
homepage = "https://github.com/avalon1610/spa-rs"
repository = "https://github.com/avalon1610/spa-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.57"
axum = { version = "0.8", features = ["multipart", "ws", "macros", "http2"] }
axum-extra = "0.10.1"
axum-help = { path = '../axum-help', version = "0.3" }
axum-server = "0.7.1"
futures-util = "0.3.30"
headers = "0.4.0"
log = "0.4.17"
md5 = "0.7.0"
parking_lot = "0.12.0"
rand = "0.8.5"
reqwest = { version = "0.12.0", default-features = false, optional = true }
rust-embed = "8.5"
rustls = "0.23.25"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["fs", "set-header", "auth"] }

[dev-dependencies]
env_logger = "0.11.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = []
reverse-proxy = ["reqwest"]
rustls = ["axum-server/tls-rustls"]
openssl = ["axum-server/tls-openssl"]

[lints.clippy]
too_many_lines = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
pedantic = { level = "warn", priority = -1 }
